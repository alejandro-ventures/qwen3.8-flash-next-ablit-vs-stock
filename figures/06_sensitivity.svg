  <g id="text_20">
   <text style="font-size: 8.3px; font-family: 'DejaVu Sans'; fill: #5f646b" transform="translate(27.72 332.959675)">Both D8 sensitivities omit BFCL, the largest decline, and use different weights (1/5 or 1/4). Their intervals cross −1.5 pp.</text>
